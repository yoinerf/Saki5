# Azure Pipelines: verificación y despliegue a Azure Static Web Apps.
# Equivale al workflow de GitHub Actions (.github/workflows/azure-static-web-apps-*.yml).
# Los secretos viven en el grupo de variables "saki5-secretos" (Pipelines > Library).

trigger:
  branches:
    include:
      - main
      - dev

# En Azure Repos las validaciones de PR se configuran con una directiva de rama (Build validation)
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: saki5-secretos
  - name: PNPM_VERSION
    value: 10.34.3
  - name: NODE_VERSION
    value: 22.x

stages:
  # Tipos, lint, pruebas y build antes de desplegar: un error no llega a producción
  - stage: Verificar
    displayName: Typecheck, lint, test y build
    jobs:
      - job: verificar
        displayName: Verificar y compilar
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            displayName: Instalar Node $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm install -g pnpm@$(PNPM_VERSION)
            displayName: Instalar pnpm $(PNPM_VERSION)

          - script: pnpm install --frozen-lockfile
            displayName: Instalar dependencias

          # Si una variable no existe en el grupo, Azure deja el texto "$(NOMBRE)" sin avisar y el sitio queda sin base de datos
          - script: |
              falla=0
              for nombre in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_GOOGLE_CLIENT_ID; do
                valor="${!nombre}"
                if [ -z "$valor" ] || [[ "$valor" == *'$('* ]] || [[ "$valor" =~ [[:space:]\"\'] ]]; then
                  echo "##vso[task.logissue type=error]$nombre falta, está vacía o tiene espacios o comillas en el grupo saki5-secretos"
                  falla=1
                fi
              done
              if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]; then
                echo "##vso[task.logissue type=error]VITE_SUPABASE_URL debe ser https://<proyecto>.supabase.co, sin / al final"
                falla=1
              fi
              exit $falla
            displayName: Revisar variables del grupo saki5-secretos
            env:
              VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
              VITE_SUPABASE_ANON_KEY: $(VITE_SUPABASE_ANON_KEY)
              VITE_GOOGLE_CLIENT_ID: $(VITE_GOOGLE_CLIENT_ID)

          - script: pnpm run typecheck
            displayName: Typecheck

          - script: pnpm run lint
            displayName: Lint

          - script: pnpm run test
            displayName: Pruebas

          # Las variables secretas no llegan solas al entorno: hay que pasarlas una por una
          - script: pnpm run build
            displayName: Build
            env:
              VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
              VITE_SUPABASE_ANON_KEY: $(VITE_SUPABASE_ANON_KEY)
              VITE_GOOGLE_CLIENT_ID: $(VITE_GOOGLE_CLIENT_ID)

          - publish: dist
            artifact: sitio
            displayName: Guardar el build

  # main despliega a producción; dev, al ambiente de pruebas "dev" de la misma Static Web App
  - stage: Desplegar
    displayName: Desplegar a Azure Static Web Apps
    dependsOn: Verificar
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/dev'))
    jobs:
      - job: desplegar
        displayName: Subir a Static Web Apps
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: Descargar el build
            inputs:
              artifact: sitio
              path: $(System.DefaultWorkingDirectory)/dist

          # Se sube el build ya hecho con pnpm; Oryx no vuelve a compilar con npm
          - task: AzureStaticWebApp@0
            displayName: Desplegar
            inputs:
              app_location: dist
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
              ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
                deployment_environment: dev
